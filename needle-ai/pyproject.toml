[build-system]
requires = ["uv_build >= 0.13.5, <0.14.0"]
build-backend = "uv_build"
[project]
name = "needle"
version = "0.1"
dependencies = [
                "openai",
                "google-genai",
                "pydantic>=2.14.1",
]
requires-python = ">=3.12"
authors = [
    {name = "Adarsh Anshul", email = "anshul.adarsh3@gmail.com"}
]
maintainers = [
    {name = "Adarsh Anshul", email = "anshul.adarsh3@gmail.com"}
]
description = "A full library sitting somewhere between langgraph and crewAI where you have control over your workflows, but most of the work is already compiled."
readme = "README.md"
license = "MIT"
keywords = ["needle","ai","library","pipeline","graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python"
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.build-backend]
module-name = "needle"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","F","I","B","UP"]


[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
